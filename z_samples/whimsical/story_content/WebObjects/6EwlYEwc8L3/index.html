<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotting Phishing Emails</title>
<style>
  :root {
    --primary: #1B4965;
    --primary-dark: #133549;
    --accent: #F4A259;
    --bg: #FAFAFA;
    --text: #22303C;
    --muted: #5B6875;
    --line: #E1E5E9;
    --surface: #FFFFFF;
    --selected: #EEF3F7;
    --ok: #1E7B34;
    --ok-bg: #E8F5EC;
    --bad: #B42318;
    --bad-bg: #FDECEA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  button { font: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* App shell: fixed 562px height, never wider than 1000px */
  .app {
    height: 562px;
    max-height: 562px;
    min-height: 562px;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--primary);
    color: #fff;
  }
  .topbar :focus-visible { outline-color: var(--accent); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg { flex: 0 0 auto; }
  .brand h1 { font-size: 16px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .folder { font-size: 13px; opacity: .8; font-weight: 400; }
  .progress {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .top-right { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }

  /* Trash can */
  .trash { position: relative; width: 34px; height: 34px; color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .trash svg { width: 30px; height: 30px; overflow: visible; }
  .trash .lid {
    transform-box: fill-box;
    transform-origin: 100% 100%;
    transition: transform .22s cubic-bezier(.3,.7,.4,1.4);
  }
  .trash.open .lid { transform: translateY(-1.5px) rotate(38deg); }
  .trash-count {
    position: absolute; top: -4px; right: -6px;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: #22303C;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
  }

  /* Toss animation pieces (fixed, outside the clipped app) */
  .paper {
    position: fixed; z-index: 1000; pointer-events: none;
    background: #fff; overflow: hidden;
    box-shadow: 0 10px 28px rgba(0,0,0,.2);
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .paper .creases { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .ball { position: fixed; z-index: 1001; pointer-events: none; width: 56px; height: 56px; will-change: transform; }
  .ball svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }

  .trashed-note {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 0 0 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--selected); color: var(--primary);
    font-size: 13px; font-weight: 600;
  }

  .body { flex: 1 1 auto; display: flex; min-height: 0; }

  /* Message list */
  .list-pane {
    flex: 0 0 340px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .list-head {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1 1 auto; }
  .list li { border-bottom: 1px solid var(--line); }
  .msg-btn {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    gap: 4px 10px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 0;
    border-left: 4px solid transparent;
    padding: 12px 14px 12px 10px;
    cursor: pointer;
  }
  .msg-btn:hover { background: #F4F6F8; }
  .msg-btn[aria-current="true"] { background: var(--selected); border-left-color: var(--accent); }
  .msg-btn:focus-visible { outline-offset: -3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
  .unread .dot { background: var(--primary); }
  .from, .subj, .snippet { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .from { font-size: 14px; grid-column: 2; }
  .subj { font-size: 14px; grid-column: 2 / 4; }
  .snippet { font-size: 13px; color: var(--muted); grid-column: 2 / 4; }
  .unread .from, .unread .subj { font-weight: 700; }
  .read .from, .read .subj { font-weight: 400; }
  .status { grid-column: 3; grid-row: 1; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .status .handled { color: var(--muted); display: inline-flex; }
  .status .tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 4px; }
  .status .tag.ok { color: var(--ok); background: var(--ok-bg); }
  .status .tag.bad { color: var(--bad); background: var(--bad-bg); }

  /* Reading pane */
  .read-pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .read-scroll { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px 24px; }
  .empty {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; gap: 10px; padding: 24px;
  }
  .back {
    display: none;
    align-items: center; gap: 6px;
    background: none; border: 0; padding: 6px 4px; margin: 0 0 12px -4px;
    color: var(--primary); font-weight: 600; cursor: pointer;
  }
  .m-subject { font-size: 20px; line-height: 1.3; margin: 0 0 14px; font-weight: 600; }
  .m-meta { display: flex; gap: 12px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .avatar {
    flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; text-transform: uppercase;
  }
  .m-from-label { font-size: 12px; color: var(--muted); }
  .m-from {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px; word-break: break-all;
  }
  .m-to { font-size: 12px; color: var(--muted); }
  .m-body { padding: 18px 0 22px; font-size: 15px; white-space: pre-wrap; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 10px 18px; border-radius: 6px;
    font-weight: 600; cursor: pointer; border: 2px solid var(--primary);
  }
  .btn-report { background: var(--primary); color: #fff; }
  .btn-report:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn-safe { background: var(--surface); color: var(--primary); }
  .btn-safe:hover { background: var(--selected); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #22303C; }
  .btn-accent:hover { background: #E8914A; border-color: #E8914A; }

  .feedback { border-radius: 8px; padding: 14px 16px; margin-top: 16px; border: 2px solid; }
  .feedback.ok { background: var(--ok-bg); border-color: var(--ok); }
  .feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
  .fb-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; margin: 0 0 6px; }
  .feedback.ok .fb-head { color: var(--ok); }
  .feedback.bad .fb-head { color: var(--bad); }
  .fb-verdict { margin: 0 0 4px; font-weight: 600; }
  .fb-why { margin: 0; }
  .fb-next { margin-top: 14px; }

  /* Results */
  .results { flex: 1 1 auto; overflow-y: auto; padding: 24px; }
  .results-inner { max-width: 640px; margin: 0 auto; }
  .results h2 { font-size: 22px; margin: 0 0 4px; }
  .score { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 18px; }
  .score .big { font-size: 40px; font-weight: 700; color: var(--primary); line-height: 1; }
  .score .pct { color: var(--muted); font-weight: 600; }
  .results h3 { font-size: 15px; margin: 18px 0 8px; }
  .miss { list-style: none; margin: 0; padding: 0; }
  .miss li { border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); }
  .miss .row1 { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--bad); font-size: 13px; margin-bottom: 4px; }
  .miss .ms { font-weight: 600; }
  .miss .mf { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; color: var(--muted); word-break: break-all; }
  .miss .flags { margin: 6px 0 0; }
  .perfect { display: flex; align-items: center; gap: 8px; color: var(--ok); background: var(--ok-bg); border: 2px solid var(--ok); border-radius: 8px; padding: 12px 14px; font-weight: 600; }

  [hidden] { display: none !important; }

  /* Small screens: list only, message replaces it */
  @media (max-width: 699px) {
    body { font-size: 15px; }
    .app { border-radius: 0; border-left: 0; border-right: 0; }
    .list-pane { flex: 1 1 auto; border-right: 0; }
    .read-pane { display: none; }
    .app.viewing .list-pane { display: none; }
    .app.viewing .read-pane { display: flex; }
    .back { display: inline-flex; }
    .read-scroll { padding: 14px 16px 20px; }
    .m-subject { font-size: 18px; }
    .actions .btn { flex: 1 1 100%; }
    .results { padding: 18px 16px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <h1>Spotting Phishing Emails <span class="folder">· Inbox</span></h1>
    </div>
    <div class="top-right">
      <div class="trash" id="trash" role="img" aria-label="Trash, 0 messages">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <g class="lid">
            <path d="M5 9h22"/>
            <path d="M12.5 9V6.5A1.5 1.5 0 0 1 14 5h4a1.5 1.5 0 0 1 1.5 1.5V9"/>
          </g>
          <path d="M8 11.5l1.3 14.7A2 2 0 0 0 11.3 28h9.4a2 2 0 0 0 2-1.8L24 11.5"/>
          <path d="M13.5 15v9M18.5 15v9"/>
        </svg>
        <span class="trash-count" id="trashCount" aria-hidden="true" hidden>0</span>
      </div>
      <div class="progress" id="progress">0 of 6 handled</div>
    </div>
  </header>

  <div class="body" id="mainBody">
    <nav class="list-pane" aria-label="Messages">
      <div class="list-head" id="listHead">Inbox</div>
      <ul class="list" id="list" aria-labelledby="listHead"></ul>
    </nav>

    <main class="read-pane" id="readPane">
      <div class="read-scroll" id="readScroll">
        <div class="empty" id="empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <p>Select a message to read it.</p>
        </div>
        <article id="message" hidden aria-labelledby="mSubject"></article>
      </div>
    </main>
  </div>

  <section class="results" id="results" hidden aria-labelledby="resultsTitle"></section>
</div>

<div class="sr-only" aria-live="polite" aria-atomic="true" id="live"></div>

<script>
(function () {
  var MESSAGES = [
    {
      from: "IT-Support@yourcompany-verify.net",
      subject: "URGENT: Your password expires in 2 hours",
      body: "Click here immediately to verify your credentials or your account will be permanently locked.",
      phishing: true,
      why: "Lookalike domain, false urgency, credential request."
    },
    {
      from: "sarah.chen@yourcompany.com",
      subject: "Q3 report draft — feedback by Friday?",
      body: "Hi, attached is the draft. Let me know your thoughts before Friday's review.",
      phishing: false,
      why: "Known internal sender, normal request, no urgency."
    },
    {
      from: "no-reply@paypa1-security.com",
      subject: "Unusual sign-in attempt detected",
      body: "We noticed a login from a new device. Confirm your identity within 24 hours to avoid suspension.",
      phishing: true,
      why: "Number \"1\" substituted for \"l\", manufactured deadline."
    },
    {
      from: "hr@yourcompany.com",
      subject: "Updated holiday schedule for next year",
      body: "The updated schedule is posted on the intranet. No action needed.",
      phishing: false,
      why: "Internal domain, informational, asks for nothing."
    },
    {
      from: "ceo.michael.torres@gmail.com",
      subject: "Quick favor - are you at your desk?",
      body: "I'm in a meeting and need you to purchase gift cards for a client. Don't call, just reply here.",
      phishing: true,
      why: "Executive impersonation from a personal address, secrecy, unusual financial request."
    },
    {
      from: "facilities@yourcompany.com",
      subject: "Parking garage closed Saturday for maintenance",
      body: "Please use the north lot this Saturday.",
      phishing: false,
      why: "Internal, routine, no links or attachments."
    }
  ];

  var ICON_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  var ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  var ICON_SMALL_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  var ICON_SMALL_X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  var ICON_FLAG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg>';
  var ICON_SHIELD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
  var ICON_BACK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

  var ICON_TRASH_SMALL = '<svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h22M12.5 9V6.5A1.5 1.5 0 0 1 14 5h4a1.5 1.5 0 0 1 1.5 1.5V9M8 11.5l1.3 14.7A2 2 0 0 0 11.3 28h9.4a2 2 0 0 0 2-1.8L24 11.5"/></svg>';
  var BALL_SVG =
    '<svg viewBox="0 0 56 56" aria-hidden="true">' +
      '<path d="M28 3 37 7 46 6 50 15 53 25 49 33 52 42 44 49 34 52 25 50 15 53 9 45 4 36 7 27 3 18 11 10 19 5Z" fill="#FFFFFF" stroke="#8C98A4" stroke-width="1.5" stroke-linejoin="round"/>' +
      '<path d="M24 18 33 28 46 15 50 15 53 25 49 33 33 28Z" fill="#E4E9EE"/>' +
      '<path d="M7 27 15 26 28 40 15 53 9 45 4 36Z" fill="#EDF1F4"/>' +
      '<path d="M33 28 49 33 52 42 44 49 28 40Z" fill="#D9E0E6"/>' +
      '<path d="M19 5 24 18 15 26 7 27M24 18 37 7M24 18 33 28 49 33M33 28 28 40 15 53M28 40 44 49M33 28 46 15M15 26 28 40" fill="none" stroke="#AEB8C2" stroke-width="1.1" stroke-linejoin="round"/>' +
    '</svg>';
  var CREASES_SVG =
    '<svg class="creases" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M0 30 L35 45 L20 100 M35 45 L70 0 M35 45 L60 60 L100 40 M60 60 L55 100 M60 60 L85 100 M10 0 L35 45 M100 75 L60 60" fill="none" stroke="#9AA6B2" stroke-width="0.8" vector-effect="non-scaling-stroke"/>' +
    '</svg>';

  var state;
  var busy = false;
  var completionLogged = false;
  var trashEl = document.getElementById("trash");
  var trashCountEl = document.getElementById("trashCount");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  var app = document.getElementById("app");
  var listEl = document.getElementById("list");
  var progressEl = document.getElementById("progress");
  var emptyEl = document.getElementById("empty");
  var msgEl = document.getElementById("message");
  var readScroll = document.getElementById("readScroll");
  var mainBody = document.getElementById("mainBody");
  var resultsEl = document.getElementById("results");
  var live = document.getElementById("live");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function announce(text) {
    live.textContent = "";
    setTimeout(function () { live.textContent = text; }, 50);
  }

  function isNarrow() { return window.matchMedia("(max-width: 699px)").matches; }

  function reset() {
    state = {
      current: null,
      items: MESSAGES.map(function () { return { read: false, answer: null }; })
    };
    resultsEl.hidden = true;
    resultsEl.innerHTML = "";
    mainBody.hidden = false;
    app.classList.remove("viewing");
    msgEl.hidden = true;
    msgEl.innerHTML = "";
    emptyEl.hidden = false;
    renderList();
    renderProgress();
  }

  function handledCount() {
    return state.items.filter(function (it) { return it.answer !== null; }).length;
  }

  function isCorrect(i) {
    var it = state.items[i];
    return it.answer !== null && it.answer === MESSAGES[i].phishing;
  }

  function renderProgress() {
    progressEl.textContent = handledCount() + " of " + MESSAGES.length + " handled";
    var trashed = state.items.filter(function (it) { return it.answer === true; }).length;
    trashCountEl.textContent = trashed;
    trashCountEl.hidden = trashed === 0;
    trashEl.setAttribute("aria-label", "Trash, " + trashed + (trashed === 1 ? " message" : " messages"));
  }

  function renderList() {
    listEl.innerHTML = "";
    MESSAGES.forEach(function (m, i) {
      var it = state.items[i];
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "msg-btn " + (it.read ? "read" : "unread");
      b.id = "msg-" + i;
      if (state.current === i) b.setAttribute("aria-current", "true");

      var statusHtml = "";
      var srStatus = it.read ? "" : "Unread. ";
      if (it.answer !== null) {
        var ok = isCorrect(i);
        statusHtml =
          '<span class="handled" title="Handled">' + ICON_SMALL_CHECK + '</span>' +
          '<span class="tag ' + (ok ? "ok" : "bad") + '">' + (ok ? ICON_SMALL_CHECK : ICON_SMALL_X) + (ok ? "Correct" : "Incorrect") + '</span>';
        srStatus += "Handled, " + (ok ? "correct" : "incorrect") + ". ";
      }

      b.innerHTML =
        '<span class="dot" aria-hidden="true"></span>' +
        '<span class="from">' + esc(m.from) + '</span>' +
        '<span class="status" aria-hidden="true">' + statusHtml + '</span>' +
        '<span class="subj">' + esc(m.subject) + '</span>' +
        '<span class="snippet">' + esc(m.body) + '</span>';
      b.setAttribute("aria-label", srStatus + "From " + m.from + ". Subject: " + m.subject);
      b.addEventListener("click", function () { openMessage(i, true); });
      li.appendChild(b);
      listEl.appendChild(li);
    });
  }

  function updateListItem(i) {
    // Re-render keeps markup simple; preserve focus if needed
    var focusedId = document.activeElement && document.activeElement.id;
    var scrollTop = listEl.scrollTop;
    renderList();
    listEl.scrollTop = scrollTop;
    if (focusedId && focusedId.indexOf("msg-") === 0) {
      var f = document.getElementById(focusedId);
      if (f) f.focus();
    }
  }

  function openMessage(i, fromList) {
    if (busy) return;
    state.current = i;
    state.items[i].read = true;
    updateListItem(i);
    renderMessage(i);
    emptyEl.hidden = true;
    msgEl.hidden = false;
    readScroll.scrollTop = 0;
    if (isNarrow()) {
      app.classList.add("viewing");
    }
    if (fromList) {
      var h = document.getElementById("mSubject");
      if (h) h.focus();
    }
  }

  function renderMessage(i) {
    var m = MESSAGES[i];
    var it = state.items[i];
    var initial = m.from.charAt(0);

    var trashed = it.answer === true;
    var html =
      '<button type="button" class="back" id="backBtn">' + ICON_BACK + 'Back to inbox</button>' +
      (trashed ? '<p class="trashed-note">' + ICON_TRASH_SMALL + 'Moved to Trash</p>' : '') +
      '<h2 class="m-subject" id="mSubject" tabindex="-1">' + esc(m.subject) + '</h2>' +
      '<div class="m-meta">' +
        '<div class="avatar" aria-hidden="true">' + esc(initial) + '</div>' +
        '<div>' +
          '<div class="m-from-label">From</div>' +
          '<div class="m-from">' + esc(m.from) + '</div>' +
          '<div class="m-to">To: me</div>' +
        '</div>' +
      '</div>' +
      (trashed ? '' : '<div class="m-body">' + esc(m.body) + '</div>');

    if (it.answer === null) {
      html +=
        '<div class="actions" role="group" aria-label="Decide what to do with this message">' +
          '<button type="button" class="btn btn-report" id="reportBtn">' + ICON_FLAG + 'Report as Phishing</button>' +
          '<button type="button" class="btn btn-safe" id="safeBtn">' + ICON_SHIELD + 'This is Safe</button>' +
        '</div>';
    } else {
      html += feedbackHtml(i);
    }

    msgEl.innerHTML = html;

    document.getElementById("backBtn").addEventListener("click", backToList);
    var r = document.getElementById("reportBtn");
    var s = document.getElementById("safeBtn");
    if (r) r.addEventListener("click", function () { answer(i, true); });
    if (s) s.addEventListener("click", function () { answer(i, false); });
    var n = document.getElementById("nextBtn");
    if (n) n.addEventListener("click", nextAction);
  }

  function feedbackHtml(i) {
    var m = MESSAGES[i];
    var it = state.items[i];
    var ok = isCorrect(i);
    var choice = it.answer ? "You reported it as phishing." : "You marked it as safe.";
    var truth = m.phishing ? "This message is phishing." : "This message is legitimate.";
    var allDone = handledCount() === MESSAGES.length;
    var nextLabel = allDone ? "See results" : "Next message";

    return '<div class="feedback ' + (ok ? "ok" : "bad") + '" id="feedback">' +
        '<p class="fb-head">' + (ok ? ICON_CHECK : ICON_X) + (ok ? "Correct" : "Incorrect") + '</p>' +
        '<p class="fb-verdict">' + choice + ' ' + truth + '</p>' +
        '<p class="fb-why"><strong>Why:</strong> ' + esc(m.why) + '</p>' +
        '<button type="button" class="btn btn-accent fb-next" id="nextBtn">' + nextLabel + '</button>' +
      '</div>';
  }

  function answer(i, saidPhishing) {
    if (busy || state.items[i].answer !== null) return;
    if (saidPhishing) {
      busy = true;
      msgEl.querySelectorAll(".actions button").forEach(function (b) { b.disabled = true; });
      tossToTrash(function () {
        busy = false;
        finishAnswer(i, true);
      });
    } else {
      finishAnswer(i, false);
    }
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // 1. crumple the email, 2. open the lid, 3. throw it in, 4. close the lid
  function tossToTrash(done) {
    if (reduceMotion.matches || !Element.prototype.animate) {
      trashEl.classList.add("open");
      wait(350).then(function () { trashEl.classList.remove("open"); return wait(150); }).then(done);
      return;
    }

    // Snapshot the visible part of the reading pane as a sheet of paper
    var r = readScroll.getBoundingClientRect();
    var cs = getComputedStyle(readScroll);
    var paper = document.createElement("div");
    paper.className = "paper";
    paper.style.left = r.left + "px";
    paper.style.top = r.top + "px";
    paper.style.width = r.width + "px";
    paper.style.height = r.height + "px";

    var inner = document.createElement("div");
    inner.style.padding = cs.padding;
    inner.style.marginTop = (-readScroll.scrollTop) + "px";
    var clone = msgEl.cloneNode(true);
    clone.removeAttribute("id");
    clone.querySelectorAll("[id]").forEach(function (n) { n.removeAttribute("id"); });
    inner.appendChild(clone);
    paper.appendChild(inner);
    paper.insertAdjacentHTML("beforeend", CREASES_SVG);
    document.body.appendChild(paper);
    msgEl.style.visibility = "hidden";

    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var sx = 56 / r.width, sy = 56 / r.height;

    // Step 1: crumple
    var crumple = paper.animate([
      { transform: "scale(1,1) rotate(0deg)", borderRadius: "0px", backgroundColor: "#FFFFFF" },
      { transform: "scale(.94,.84) rotate(-2deg) skewX(3deg)", borderRadius: "8px", offset: .18 },
      { transform: "scale(.78,.66) rotate(3deg) skewY(-4deg)", borderRadius: "20px", offset: .38 },
      { transform: "scale(.52,.5) rotate(-5deg) skewX(-5deg)", borderRadius: "34%", offset: .6 },
      { transform: "scale(.26,.3) rotate(8deg)", borderRadius: "44%", backgroundColor: "#EEF1F4", offset: .8 },
      { transform: "scale(" + sx + "," + sy + ") rotate(20deg)", borderRadius: "50%", backgroundColor: "#E6EBEF" }
    ], { duration: 700, easing: "cubic-bezier(.45,0,.55,1)", fill: "forwards" });
    inner.animate([{ opacity: 1 }, { opacity: .9, offset: .35 }, { opacity: 0 }], { duration: 700, fill: "forwards" });
    paper.querySelector(".creases").animate([{ opacity: 0 }, { opacity: .9, offset: .4 }, { opacity: 1 }], { duration: 700, fill: "forwards" });

    var ball;
    crumple.finished.then(function () {
      // Swap the squashed sheet for a paper ball
      ball = document.createElement("div");
      ball.className = "ball";
      ball.innerHTML = BALL_SVG;
      ball.style.left = (cx - 28) + "px";
      ball.style.top = (cy - 28) + "px";
      document.body.appendChild(ball);
      paper.remove();
      return ball.animate([
        { transform: "scale(.85) rotate(20deg)" },
        { transform: "scale(1.12) rotate(28deg)", offset: .5 },
        { transform: "scale(1) rotate(30deg)" }
      ], { duration: 180, easing: "ease-out", fill: "forwards" }).finished;
    }).then(function () {
      // Step 2: open the lid
      trashEl.classList.add("open");
      return wait(220);
    }).then(function () {
      // Step 3: throw it in, along an arc
      var tr = trashEl.getBoundingClientRect();
      var tx = tr.left + tr.width / 2;
      var ty = tr.top + tr.height * 0.12;
      var peak = Math.min(140, Math.max(60, Math.abs(cy - ty) * 0.5));
      var frames = [];
      var N = 24;
      for (var k = 0; k <= N; k++) {
        var t = k / N;
        var x = (tx - cx) * t;
        var y = (ty - cy) * t - peak * 4 * t * (1 - t);
        if (cy + y < 6) y = 6 - cy;
        var s = 1 - 0.68 * t;
        frames.push({ transform: "translate(" + x + "px," + y + "px) rotate(" + (30 + 540 * t) + "deg) scale(" + s + ")", offset: t * 0.82 });
      }
      frames.push({ transform: "translate(" + (tx - cx) + "px," + (ty - cy + tr.height * 0.45) + "px) rotate(600deg) scale(.26)", opacity: 0, offset: 1 });
      return ball.animate(frames, { duration: 760, easing: "cubic-bezier(.35,.1,.55,1)", fill: "forwards" }).finished;
    }).then(function () {
      ball.remove();
      // Step 4: close the lid, with a little thud
      trashEl.classList.remove("open");
      trashEl.animate([
        { transform: "translateY(0) rotate(0)" },
        { transform: "translateY(1.5px) rotate(-6deg)", offset: .3 },
        { transform: "translateY(0) rotate(4deg)", offset: .65 },
        { transform: "translateY(0) rotate(0)" }
      ], { duration: 320, easing: "ease-out" });
      return wait(300);
    }).then(done);
  }

  function finishAnswer(i, saidPhishing) {
    state.items[i].answer = saidPhishing;
    var ok = isCorrect(i);
    var m = MESSAGES[i];

    renderProgress();
    updateListItem(i);
    msgEl.style.visibility = "";
    renderMessage(i);
    if (saidPhishing && msgEl.animate && !reduceMotion.matches) {
      msgEl.animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 220, easing: "ease-out" });
    }

    announce(
      (saidPhishing ? "Moved to Trash. " : "") +
      (ok ? "Correct. " : "Incorrect. ") +
      (m.phishing ? "This message is phishing. " : "This message is legitimate. ") +
      "Why: " + m.why + " " +
      handledCount() + " of " + MESSAGES.length + " handled."
    );

    var fb = document.getElementById("feedback");
    if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest" });
    var n = document.getElementById("nextBtn");
    if (n) n.focus();

    if (handledCount() === MESSAGES.length && !completionLogged) {
      completionLogged = true;
      console.log("Interaction Complete");
    }
  }

  function nextAction() {
    if (busy) return;
    if (handledCount() === MESSAGES.length) {
      showResults();
      return;
    }
    // Next unhandled message after current, wrapping around
    var start = state.current === null ? 0 : state.current + 1;
    for (var k = 0; k < MESSAGES.length; k++) {
      var idx = (start + k) % MESSAGES.length;
      if (state.items[idx].answer === null) {
        openMessage(idx, true);
        return;
      }
    }
  }

  function backToList() {
    if (busy) return;
    var i = state.current;
    app.classList.remove("viewing");
    var b = document.getElementById("msg-" + i);
    if (b) b.focus();
  }

  function showResults() {
    var total = MESSAGES.length;
    var correct = 0;
    var wrong = [];
    MESSAGES.forEach(function (m, i) {
      if (isCorrect(i)) correct++; else wrong.push(i);
    });
    var pct = Math.round((correct / total) * 100);

    var html = '<div class="results-inner">' +
      '<h2 id="resultsTitle" tabindex="-1">Your results</h2>' +
      '<div class="score"><span class="big">' + correct + ' of ' + total + '</span><span class="pct">correct (' + pct + '%)</span></div>';

    if (wrong.length === 0) {
      html += '<p class="perfect">' + ICON_CHECK + 'You handled every message correctly.</p>';
    } else {
      html += '<h3>Messages you got wrong (' + wrong.length + ')</h3><ul class="miss">';
      wrong.forEach(function (i) {
        var m = MESSAGES[i];
        var label = m.phishing
          ? "Marked safe, but this was phishing"
          : "Reported as phishing, but this was legitimate";
        var flagsLabel = m.phishing ? "Red flags missed:" : "Why it was safe:";
        html += '<li>' +
          '<div class="row1">' + ICON_SMALL_X + esc(label) + '</div>' +
          '<div class="ms">' + esc(m.subject) + '</div>' +
          '<div class="mf">' + esc(m.from) + '</div>' +
          '<p class="flags"><strong>' + flagsLabel + '</strong> ' + esc(m.why) + '</p>' +
        '</li>';
      });
      html += '</ul>';
    }

    html += '<p><button type="button" class="btn btn-report" id="retryBtn">Try again</button></p></div>';

    resultsEl.innerHTML = html;
    mainBody.hidden = true;
    resultsEl.hidden = false;
    resultsEl.scrollTop = 0;

    document.getElementById("retryBtn").addEventListener("click", function () {
      reset();
      announce("Inbox reset. 0 of " + MESSAGES.length + " handled.");
      var first = document.getElementById("msg-0");
      if (first) first.focus();
    });

    announce("Results: " + correct + " of " + total + " correct. " +
      (wrong.length ? wrong.length + " incorrect." : "No mistakes."));
    document.getElementById("resultsTitle").focus();
  }

  // Keep layout sane when crossing the breakpoint
  window.matchMedia("(max-width: 699px)").addEventListener("change", function (e) {
    if (!e.matches) app.classList.remove("viewing");
    else if (state.current !== null && !msgEl.hidden) app.classList.add("viewing");
  });

  reset();
})();
</script>
</body>
</html>
